<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="description" content="Climathon 2026, Team 5 Battery Monster: what happens to a used EV battery, in 7 simple steps. Work in progress; figures are estimates.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1929">
<meta property="og:image" content="logo-512.png">
<title>Battery Monster: the life of an EV battery</title>
<style>
  :root { --bg:#0b1929; --panel:#10243a; --card:#16304c; --text:#f2f6fa; --muted:#9fb3c8; --line:#27496b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  #main { flex:1 1 auto; overflow:auto; padding:18px 18px 10px; }
  .top { display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 24px; max-width:1500px; margin:0 auto 14px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:64px; height:64px; border-radius:14px; flex:0 0 auto; }
  h1 { margin:0; font-size:clamp(22px,3.2vw,34px); line-height:1.15; }
  .sub { color:var(--muted); font-size:clamp(14px,1.6vw,17px); margin-top:4px; }
  .legend { margin-left:auto; display:flex; gap:14px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .journey { max-width:1500px; margin:0 auto; }
  .phases { display:flex; gap:6px; margin-bottom:8px; }
  .phase { border-radius:10px; padding:6px 10px; font-size:13px; font-weight:700; text-align:center; color:#08141f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .strip { display:flex; gap:6px; overflow-x:auto; padding:4px 2px 12px; }
  .step { position:relative; flex:1 0 98px; min-width:98px; background:none; border:0; color:inherit; font:inherit; cursor:pointer; padding:0 2px; text-align:center; }
  .step::before { content:""; position:absolute; top:22px; left:0; right:0; height:3px; background:var(--line); z-index:0; }
  .step:first-child::before { left:50%; }
  .step:last-child::before { right:50%; }
  .badge { position:relative; z-index:1; margin:0 auto; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#08141f; box-shadow:0 0 0 5px var(--bg); }
  .card { margin-top:10px; background:var(--card); border:2px solid transparent; border-radius:16px; padding:12px 6px 10px; transition:transform .15s, border-color .15s, background .15s; }
  .step:hover .card { transform:translateY(-3px); background:#1b3a5a; }
  .step.on .card { border-color:var(--c); background:#1d3f63; transform:translateY(-3px); }
  .ico { font-size:clamp(28px,3.2vw,40px); line-height:1.1; }
  .lab { margin-top:6px; font-size:clamp(12px,1.15vw,14.5px); font-weight:700; line-height:1.2; }
  .hint { text-align:center; color:var(--muted); margin-top:6px; font-size:15px; }
  #panel { flex:0 0 auto; height:0; overflow:hidden; background:var(--panel); border-top:3px solid var(--c, var(--line)); transition:height .3s ease; }
  #panel.open { height:min(56vh, 560px); overflow:auto; }
  .pin { max-width:1500px; margin:0 auto; padding:16px 18px 24px; }
  .phead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .big { font-size:46px; line-height:1; }
  .ptitle { font-size:clamp(20px,2.4vw,28px); font-weight:800; margin:0; }
  .nav { margin-left:auto; display:flex; gap:8px; }
  button.nb { background:#1b3a5a; color:var(--text); border:1px solid #2f5b86; border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.nb:hover { background:#24507d; }
  .line { font-size:clamp(16px,1.9vw,21px); line-height:1.4; margin:2px 0 14px; max-width:1100px; }
  .cols { display:grid; grid-template-columns: 1.25fr 1fr; gap:22px; align-items:start; }
  @media (max-width: 900px) { .cols { grid-template-columns:1fr; } }
  .viz { background:#0c1d30; border:1px solid var(--line); border-radius:16px; padding:16px; }
  .flow { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 6px; }
  .node { background:var(--card); border:2px solid var(--c, #4ea8ff); border-radius:14px; padding:8px 12px; text-align:center; min-width:92px; }
  .node .e { font-size:30px; line-height:1.1; }
  .node .t { font-size:13.5px; font-weight:700; margin-top:2px; }
  .node .s { font-size:12px; color:var(--muted); margin-top:2px; }
  .arr { font-size:24px; color:var(--muted); padding:0 2px; }
  .stack { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width: 700px) { .grid3 { grid-template-columns:1fr; } }
  .tile { background:var(--card); border:2px solid var(--c, #4ea8ff); border-radius:14px; padding:10px 12px; }
  .tile .e { font-size:28px; }
  .tile .t { font-weight:800; font-size:15px; margin:2px 0; }
  .tile .s { font-size:13.5px; color:#cfe0f0; line-height:1.35; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .chip { border:2px solid var(--c, #ffbe0b); border-radius:999px; padding:6px 12px; font-size:13.5px; background:var(--card); }
  .gauge { height:34px; border-radius:10px; background:#08141f; border:2px solid #fff; position:relative; overflow:hidden; margin:6px 0; }
  .gauge i { display:block; height:100%; background:linear-gradient(90deg,#3ddc97,#2ec4b6); }
  .gl { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); }
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar { display:grid; grid-template-columns:70px 1fr 78px; gap:8px; align-items:center; font-size:14px; }
  .track { position:relative; height:26px; background:#08141f; border-radius:8px; }
  .track::after { content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:#9fb3c8; }
  .fill { position:absolute; top:0; bottom:0; border-radius:8px; }
  .pts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .pts li { display:flex; gap:10px; align-items:flex-start; font-size:15.5px; line-height:1.4; }
  .pts .pi { font-size:20px; flex:0 0 28px; text-align:center; }
  .tg { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:1px 6px; margin-left:6px; color:#08141f; vertical-align:1px; white-space:nowrap; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border-radius:14px; padding:8px 14px; border-left:5px solid var(--c, #4ea8ff); min-width:130px; }
  .stat b { display:block; font-size:24px; line-height:1.1; }
  .stat span { font-size:12.5px; color:var(--muted); }
  .open h3, .found h3 { margin:14px 0 6px; font-size:15px; }
  .ft { font-size:12.5px; color:var(--muted); text-align:center; padding:2px 10px 8px; }
  @media (max-width: 700px) {
    .logo { width:44px; height:44px; }
    #main { padding:12px 12px 6px; }
    .legend, .sub { display:none; }
    h1 { font-size:20px; }
    .phase { font-size:10.5px; padding:4px 4px; }
    .hint { font-size:13px; }
    #panel.open { height:68vh; }
    .big { font-size:34px; }
    .nav { margin-left:0; width:100%; }
    .ft { font-size:11px; }
  }
</style>
</head>
<body>
<div id="main">
  <div class="top">
    <div class="brand">
      <img class="logo" src="logo-128.png" width="64" height="64" alt="Battery Monster logo">
      <div>
      <h1>The life of an EV battery, in 7 steps</h1>
      <div class="sub">Team 5 · Battery Monster · Climathon 2026 — from the factory to second life or recycling</div>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#3ddc97"></span>sourced</span>
      <span><span class="dot" style="background:#ffbe0b"></span>our estimate</span>
      <span><span class="dot" style="background:#ff6b6b"></span>still to check</span>
    </div>
  </div>
  <div class="journey">
    <div class="phases" id="phases"></div>
    <div class="strip" id="strip"></div>
    <div class="hint" id="hint">Tap a step to see how it works. Use the arrow keys to move along.</div>
  </div>
</div>
<div id="panel"><div class="pin" id="pin"></div></div>
<div class="ft">Work in progress. Figures marked as estimates are not validated.</div>
<script src="app.js?v=9"></script>
</body>
</html>
