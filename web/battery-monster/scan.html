<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="description" content="Battery Monster in 3D: a full car scan after an EV crash, then a zoom into the battery. An illustration, not real data.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#050607">
<meta property="og:title" content="Battery Monster in 3D: scan the car, then the battery">
<meta property="og:image" content="https://rderics.id.lv/battery-monster/logo-512.png">
<title>Battery Monster in 3D: scan the car, then the battery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050607; --surface:#181818; --line:#313131; --text:#ffffff; --muted:#9b9b9b; --ok:#5fd08a; --warn:#f2c14e; --bad:#f2876b; --curve:cubic-bezier(0.22,1,0.36,1); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Manrope", system-ui, sans-serif; font-size:16px; line-height:24px; font-weight:400; overflow:hidden; }
  #gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }
  a { color:var(--text); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--ok); outline-offset:2px; border-radius:8px; }

  .top { position:fixed; top:16px; left:16px; right:16px; z-index:5; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .glass { background:rgba(24,24,24,0.72); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid var(--line); }
  .back { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; text-decoration:none; font-size:14px; line-height:20px; font-weight:600; transition:transform 300ms var(--curve); }
  .back:hover { transform:translateX(-2px); }
  .back img { width:24px; height:24px; border-radius:8px; }
  .live { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; font-size:12px; line-height:16px; font-weight:600; color:var(--muted); }
  .live i { width:8px; height:8px; border-radius:999px; background:var(--ok); animation:blink 1.6s var(--curve) infinite; }
  @keyframes blink { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(0.6); opacity:0.5; } }

  .cap { position:fixed; left:16px; bottom:88px; z-index:4; width:min(420px, calc(100vw - 32px)); border-radius:16px; padding:24px; transition:opacity 500ms var(--curve), transform 500ms var(--curve); }
  .cap.swap { opacity:0; transform:translateY(12px); }
  .eyebrow { font-size:12px; line-height:16px; font-weight:600; color:var(--ok); margin:0 0 8px; }
  h1 { margin:0; font-size:30px; line-height:36px; font-weight:600; text-wrap:balance; }
  .cap p { margin:12px 0 0; color:var(--muted); text-wrap:pretty; }
  .chips { display:none; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .chips.show { display:flex; }
  .chip { padding:8px 12px; border-radius:8px; font-size:14px; line-height:20px; font-weight:600; background:#272727; color:var(--muted); border:1px solid var(--line); }
  .chip.on { background:var(--warn); color:#000; border-color:var(--warn); }
  .note { font-size:12px; line-height:16px; color:var(--muted); margin-top:12px; display:none; }
  .note.show { display:block; }
  .btn { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:8px 16px; border-radius:8px; background:var(--text); color:#000; text-decoration:none; font-size:16px; line-height:24px; font-weight:600; border:1px solid var(--text); transition:transform 300ms var(--curve); }
  .btn:hover { transform:translateY(-2px); }
  .btn:active { transform:scale(0.98); }
  .btn[hidden] { display:none; }

  .bar { position:fixed; left:16px; right:16px; bottom:16px; z-index:5; border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:16px; }
  .ctl { flex:0 0 auto; min-width:72px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#272727; color:var(--text); font:inherit; font-size:14px; line-height:20px; font-weight:600; cursor:pointer; transition:transform 300ms var(--curve), background-color 300ms var(--curve); }
  .ctl:hover { background:#313131; transform:translateY(-1px); }
  .ctl:active { transform:scale(0.98); }
  .time { flex:0 0 auto; font-size:12px; line-height:16px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:24px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(to right, var(--ok) var(--fill, 0%), #313131 var(--fill, 0%)); }
  input[type=range]::-moz-range-track { height:4px; border-radius:4px; background:#313131; }
  input[type=range]::-moz-range-progress { height:4px; border-radius:4px; background:var(--ok); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:999px; background:var(--text); margin-top:-6px; border:0; }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:999px; background:var(--text); border:0; }
  .nogl { display:none; }
  .no-gl .nogl { display:block; position:fixed; inset:0; z-index:1; background:radial-gradient(circle at 50% 40%, #12302a, #050607 70%); }
  @media (min-width:768px) {
    h1 { font-size:36px; line-height:40px; }
    .cap { left:48px; bottom:96px; padding:32px; }
    .top { left:48px; right:48px; }
    .bar { left:48px; right:48px; }
  }
  @media (max-width:520px) { .live { display:none; } .cap { bottom:92px; padding:16px; } h1 { font-size:24px; line-height:32px; } }
  @media (prefers-reduced-motion: reduce) { .cap { transition:opacity 300ms linear; transform:none; } .live i { animation:none; } .back, .ctl, .btn { transition:none; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="nogl" aria-hidden="true"></div>

<header class="top">
  <a class="back glass" href="./"><img src="logo-128.png" alt="">Battery Monster</a>
  <span class="live glass"><i></i>Auto play · illustration, not real data</span>
</header>

<section class="cap glass" id="cap" aria-live="polite">
  <p class="eyebrow" id="eyebrow">AFTER A CRASH</p>
  <h1 id="title">Is the battery still good?</h1>
  <p id="body">The most expensive part of an EV hides under the floor.</p>
  <div class="chips" id="chips" aria-label="Example outcome">
    <span class="chip">Keep</span><span class="chip on">Repair</span><span class="chip">Replace</span>
  </div>
  <p class="note" id="note">Made up cell data. We never say "safe", only what we found today.</p>
  <a class="btn" id="cta" href="./#money" hidden>See the plan</a>
</section>

<div class="bar glass">
  <button class="ctl" id="play" type="button" aria-label="Pause">Pause</button>
  <button class="ctl" id="restart" type="button">Replay</button>
  <input id="seek" type="range" min="0" max="28" step="0.01" value="0" aria-label="Timeline">
  <span class="time" id="time">0:00</span>
</div>

<script type="module" src="scan.js?v=3"></script>
</body>
</html>
